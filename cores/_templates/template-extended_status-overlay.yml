templates:
  # {library} STATUS BANNER
  {library}_Status_Banner:
    sync_mode: sync
    builder_level: show
    overlay:
      name: backdrop
      horizontal_offset: <<horizontal_offset>>
      horizontal_align: <<horizontal_align>>
      vertical_offset: <<vertical_offset>>
      vertical_align: <<vertical_align>>
      group: <<group>>
      weight: <<weight>>
      back_color: <<back_color>>
      back_width: <<back_width>>
      back_height: <<back_height>>
      back_line_color: <<back_line_color>>
      back_line_width: <<back_line_width>>
      back_padding: <<back_padding>>
      back_radius: <<back_radius>>
      file: <<file>>
      git: <<git>>
      repo: <<repo>>
      url: <<url>>

    default:
      group: banner_backdrop
      horizontal_align: center
      vertical_align: top
      horizontal_offset: 0
      vertical_offset: 0
      back_width: 1000
      back_height: 90

    optional:
      - back_line_color
      - back_line_width
      - back_padding
      - back_radius
      - file
      - git
      - repo
      - url

  # {library} STATUS
  {library}_Status:
    sync_mode: sync
    builder_level: show
    overlay:
      name: text(<<text>>)
      horizontal_offset: <<horizontal_offset>>
      horizontal_align: <<horizontal_align>>
      vertical_offset: <<vertical_offset>>
      vertical_align: <<vertical_align>>
      font: <<font>>
      font_size: <<font_size>>
      font_color: <<font_color>>
      group: <<group>>
      weight: <<weight>>
      back_color: <<back_color>>
      back_width: <<back_width>>
      back_height: <<back_height>>
      back_align: <<back_align>>
      back_line_color: <<back_line_color>>
      back_line_width: <<back_line_width>>
      back_padding: <<back_padding>>
      back_radius: <<back_radius>>
      file: <<file>>
      git: <<git>>
      repo: <<repo>>
      url: <<url>>

    default:
      font: config/fonts/Juventus-Fans-Bold.ttf
      group: banner_text
      horizontal_align: center
      vertical_align: top
      horizontal_offset: 0
      vertical_offset: 0
      font_size: 70
      back_color: "#00000000"
      back_align: center
      back_height: 90
      back_width: 1000

    optional:
      - back_line_color
      - back_line_width
      - back_padding
      - back_radius
      - file
      - git
      - repo
      - url
